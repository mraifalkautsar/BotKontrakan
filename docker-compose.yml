version: '3.8'

services:
  kontrakan-app:
    build: .
    container_name: kontrakan-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - kontrakan_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kontrakan_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  kontrakan_data:
    name: kontrakan_data

networks:
  kontrakan_network:
    driver: bridge